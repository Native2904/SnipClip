[history]
max_entries=100
name_preview_length=20
; how many characters of the copied text become the panel's Name column
; (before the "_<id>" suffix). 5-100.
persist_history=1
; 1 = history survives a Total Commander restart (stored next to the
; plugin: SnipClip_history.json + a history\ folder). 0 = memory only,
; gone when TC closes - use "! Verlauf leeren" any time either way to
; wipe it, e.g. after something sensitive was accidentally copied.
dedup_consecutive=1
; 1 = copying the exact same text twice in a row does not create a
; second entry (default). 0 = every copy is logged, even if identical
; to the previous one - useful if you want to see HOW OFTEN you copied
; something, not just that you did.
AllowSingleDelete=1
; 1 = Entf can delete one history/"! Pfade" entry at a time (with an
; extra confirmation beyond TC's own, since this breaks the otherwise-
; immutable history - see project notes). 0 = back to the original
; strict rule: only "! Verlauf leeren" can ever remove anything.

[Theme]
Name=basic
Mode=dark
; Name= gruvbox | everforest | solarized | custom
; Mode= dark | light
FontBrightness=0
BackgroundBrightness=0
; Fixed, curated steps, -3 to +3 - NOT a free percentage value (every
; step is meant to be checked against every theme, not trusted to "just
; work" for an arbitrary number). FontBrightness nudges all text-ish
; colors together (±7 percentage points of lightness per step, max ±21).
; BackgroundBrightness only touches the background, kept narrower (±5pp
; per step, max ±15) - it's the largest area on screen and the most
; contrast-sensitive. If a combination of both ends up too low-contrast,
; SnipClip falls back to the unadjusted theme automatically and shows a
; warning in the Alt+Enter dialogs - checked fresh every time the theme
; is loaded, not just once.
TimeBasedMode=0
LightStartHour=6
DarkStartHour=18
; 1 = Mode= above is ignored, and light/dark is instead decided by the
; current hour (0-23) - e.g. the defaults mean "light" from 6:00 to
; 17:59, "dark" the rest of the time. Re-evaluated fresh every time a
; dialog opens, so the switch takes effect live, no restart needed.
; Does NOT affect SnipClipLister.wlx's own Strg+E edit-mode light/dark
; switch, or the Textbaustein/StickySnip comment mask's - both use
; [lister] Theme= (gruvbox/everforest/solarized) independently instead,
; since Alien Blood (this main [Theme] section's default) was never
; designed with a real light variant - artificially lightening it
; looked wrong in testing, so the comment mask was switched to reuse
; the Lister's own proper light+dark theme pair instead.

[lister]
Theme=gruvbox
; Used only by SnipClipLister.wlx for its dark(read)/light(edit) switch -
; must be gruvbox, everforest, or solarized (all have a real light+dark
; pair). Basic/Custom are not accepted here since Basic (Alien Blood) has
; no light form, and Custom isn't guaranteed to have both.
MonoFont=fonts\JetBrainsMono-Regular.ttf
MonoFontName=JetBrains Mono
; Optional - path to a .ttf file (relative to the plugin folder, or an
; absolute path) and the font's internal family name (NOT necessarily
; the same as the filename - right-click the .ttf in Explorer and look
; at the preview window's heading to find the real name). Loaded
; privately (not installed system-wide). File missing/unreadable, or
; MonoFontName= wrong: falls back to Consolas, no error shown.
; A wrong MonoFontName= does NOT error - Windows silently substitutes a
; different font, so double-check this if the Lister looks unexpected.
; Pre-filled above for JetBrains Mono (SIL OFL, free) - the .ttf itself
; isn't bundled (see fonts\ folder), download it yourself and drop it in
; - see fonts\PLATZIERE_DEINE_TTF_HIER.txt for the exact steps.

[sticky]
default_category=Unsortiert
; Used when a snip is pinned (F5/drag&drop) directly onto the
; "! StickySnips" row itself, without a category chosen - auto-created
; the first time it's needed, shows up like any other category.

[image_capture]
FishImage=0
; 1 = grundsätzlich JEDES Bild erfassen, das in der Zwischenablage
; landet - gefiltert nur durch Exclude= unten (Opt-Out statt Opt-In).
; 0 (Standard) = Feature komplett aus.
;
; Warum Opt-Out statt einer Whitelist: eine Whitelist verlangt, die
; Quelle VOR dem Erfassen sicher zu kennen - scheitert zuverlässig bei
; kurzlebigen Programmen wie FastStone Capture (das Aufnahmefenster ist
; oft schon weg, bevor SnipClip reagiert). Eine Exclude-Liste dreht das
; um: eine nicht ermittelbare Quelle gilt automatisch als "nicht
; ausgeschlossen" und wird erfasst, statt sicherheitshalber verworfen
; zu werden.
Exclude=
; Komma-getrennt, Programme, die NICHT erfasst werden sollen (z. B.
; dein eigener Bildbetrachter, damit das Anzeigen eines gespeicherten
; Screenshots nicht selbst wieder als neuer Screenshot gilt). Beispiel:
; Exclude=i_view64.exe,explorer.exe
; Kann Programmname oder voller Pfad sein - nur der Dateiname selbst
; wird verglichen.
max_screenshots=50
; Count-based limit, oldest goes first when exceeded - same convention
; as history's own max_entries.
max_total_size_mb=200
; Independent, additional limit in MB - screenshots vary wildly in size
; (a small dialog vs. a 4K capture), so a count alone doesn't serve
; everyone well. Whichever limit gets hit first trims the oldest
; screenshot. Set both generously high if storage isn't a concern, or
; tighten max_total_size_mb specifically if it is - the two don't
; conflict, they're just two independent ceilings.
;
; Always saved as .bmp - by design, not a placeholder waiting for a
; future codec. By the time an image reaches the clipboard, its
; original format (jpg/png/whatever) is already gone - Windows
; normalizes everything to raw pixel data first. BMP is universally
; readable, so no conversion happens on SnipClip's end at all; if you
; want a different format afterward, any image viewer/editor can
; convert the saved .bmp in a couple of clicks.

[textbaustein]
separator_blank_lines=1
; How many blank lines sit between pieces appended to the same
; Textbaustein - 0 to 3.
highlight_last_append=1
; 1 = opening a Textbaustein in the Lister (F3) automatically selects
; (highlights) the fragment most recently appended to it - plain
; Windows text selection, disappears the instant you click anywhere,
; nothing custom-drawn. 0 = no automatic selection, opens with the
; caret at the start like any other entry.
;
; No setting here for the Entwurf/secured split itself - that's not
; optional. New Textbausteine always start as drafts under
; "! Textbaustein\Entwurf\" (only place appending still works); F6
; (rename) into "! Textbaustein\<name>" directly secures one, after
; which further drops with that name auto-create a fresh draft instead
; of silently mutating the secured one.

[path_resolve]
Enabled=0
Format=local
; local | forwardslash | unc | fileuri | wsl
; Off by default. When on, copying a FILE (not text) - e.g. in TC or
; Explorer - captures its path as a text entry, in the chosen format.
; unc only resolves for mapped network drives, falls back to local
; otherwise. wsl converts "C:\Foo" to "/mnt/c/Foo".
AllowExtensions=
; Semicolon-separated, e.g. ".cs;.txt;.md" - empty = any extension.
AllowFolders=
; Semicolon-separated path prefixes, e.g. "C:\Projects\;D:\Notes\" -
; empty = any folder. Both filters must pass if both are set.

[menu]
RootButtons=
; Comma-separated, which special rows stay directly at root instead of
; being tucked under "! menu" (RecentTab-style portal). Keys: Pause,
; Clear, Sticky, Path, Textbaustein, Comments, Screenshots. Example: RootButtons=Sticky,Path
; Empty (default) = everything lives under "! menu", root stays as
; uncluttered as possible - "! menu" itself is always present at root
; regardless of this setting.

[Settings]
NoColors=0
Language=auto
; auto (default) = detected from Windows' own UI language - German and
; Russian systems get their matching translation, everyone else gets
; English. Set explicitly to "deu", "eng", or "rus" to override the
; detection, regardless of what Windows itself is set to.
DebugLogging=1
; Set to 0 once things work reliably - writes SnipClip_debug.log next
; to the DLL on every clipboard event and startup step.
RespectClipboardExclude=1
; 1 = honors the official Windows "ExcludeClipboardContentFromMonitor
; Processing" clipboard format (used by KeePassXC, Bitwarden, 1Password,
; Chrome/Edge incognito, etc.) and skips capturing that content entirely
; (default). 0 = ignore that flag, capture everything regardless - only
; for deliberate testing, not recommended for normal use. Honest caveat:
; this flag is a voluntary signal apps CAN set, not an enforced
; restriction - some sources may not set it even for sensitive data.
StartPaused=0
; 0 = ClipWatch is actively capturing from the moment TC loads the
; plugin (default). 1 = starts paused - use "! ClipWatch fortsetzen" to
; turn it on manually each session, for anyone who'd rather opt in every
; time than have it running by default.
LiveRefreshAfterCapture=1
; 1 = a newly captured clip appears in the panel immediately, without a
; manual Strg+R (default). Event-driven, not a timer/poll - fires right
; after each capture, using a window handle opportunistically cached
; from your last interaction with the panel (Alt+Enter, F3, etc.). If
; you haven't touched the panel yet this session, there's nothing cached
; to notify, so the very first capture may still need a manual refresh.
; 0 = never auto-refresh, always requires Strg+R manually.
FallbackSourceIcon=
; Path to your own .ico file, shown instead of the built-in floating-eye
; icon whenever a clip/pin/screenshot's source program can't be
; determined (unknown source, or a known source whose .exe no longer
; exists at its recorded path - uninstalled or moved since capture).
; Empty (default) = use the built-in icon. This only affects the
; fallback case - whenever a source IS known and its .exe still exists,
; SnipClip shows that program's own real icon instead, automatically,
; no setting needed for that.
